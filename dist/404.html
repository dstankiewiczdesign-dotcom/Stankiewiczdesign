  <style>
  :root{
    --ink:#0A0A0B; --ink-2:#131316; --ink-3:#191A1D;
    --paper:#EDEAE4; --concrete:#8B8882; --steel:#B4B6B8; --cobalt:#1B34C4;
    --line:rgba(237,234,228,.14); --line-dark:rgba(10,10,11,.14);
    --display:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,Menlo,"SF Mono",monospace;
    --gap:clamp(28px,4vw,64px); --pad:clamp(22px,5vw,88px); --nav:64px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--display);
    font-weight:300;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{display:block;max-width:100%}
  a{color:inherit}
  ::selection{background:var(--cobalt);color:#fff}
  :focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
  h1,h2,h3{font-weight:300;margin:0;text-wrap:balance;letter-spacing:-.015em}
  p{margin:0}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--concrete);margin:0}

  /* ══ NAWIGACJA ══ */
  .nav{position:fixed;inset:0 0 auto 0;z-index:60;height:var(--nav);display:flex;align-items:center;
    gap:20px;padding:0 var(--pad);transition:background .4s,border-color .4s,backdrop-filter .4s;
    border-bottom:1px solid transparent}
  .nav.stuck{background:rgba(10,10,11,.82);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
  .brand{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    text-decoration:none;white-space:nowrap}
  .navlinks{display:flex;gap:28px;margin-left:auto}
  .navlinks a{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    text-decoration:none;color:var(--steel);transition:color .3s}
  .navlinks a:hover{color:var(--paper)}
  .navtools{display:flex;align-items:center;gap:18px;margin-left:28px}
  .socials{display:flex;gap:14px}
  .socials a{color:var(--concrete);transition:color .3s;display:flex}
  .socials a:hover{color:var(--paper)}
  .lang{display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
  .lang button{background:none;border:0;color:var(--concrete);cursor:pointer;font:inherit;padding:4px 5px;
    transition:color .3s}
  .lang button[aria-pressed="true"]{color:var(--paper)}
  .lang span{color:var(--line);color:rgba(237,234,228,.3)}
  .burger{display:none;margin-left:auto;background:none;border:0;color:var(--paper);cursor:pointer;padding:8px}
  .menu{position:fixed;inset:0;z-index:70;background:rgba(10,10,11,.97);backdrop-filter:blur(8px);
    display:none;flex-direction:column;justify-content:center;gap:6px;padding:var(--pad)}
  .menu.on{display:flex}
  .menu a{font-size:clamp(28px,8vw,44px);text-decoration:none;padding:10px 0;color:var(--paper)}
  .menu .close{position:absolute;top:16px;right:var(--pad);background:none;border:0;color:var(--paper);
    font-size:28px;line-height:1;cursor:pointer;padding:8px}
  @media(max-width:900px){
    .navlinks{display:none}
    .burger{display:block}
    .navtools{margin-left:0;order:-1}
  }

  /* ══ HERO ══ */
  .hero{position:relative;min-height:100svh;display:grid;align-items:end;overflow:hidden}
  .slides{position:absolute;inset:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s cubic-bezier(.4,0,.2,1)}
  .slide.on{opacity:1}
  .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scale(1.10);transform-origin:var(--ox,50%) var(--oy,50%)}
  /* powolny najazd trwa dłużej niż postój kadru, więc ruch nigdy się nie zatrzymuje */
  .slide.on img{transform:scale(1.005);transition:transform 9s linear}
  .dots{position:absolute;right:var(--pad);bottom:clamp(40px,7vh,86px);z-index:3;
    display:flex;flex-direction:column;gap:11px;align-items:flex-end}
  .dots button{width:22px;height:2px;padding:0;border:0;cursor:pointer;border-radius:2px;
    background:rgba(237,234,228,.28);transition:background .5s,width .5s}
  .dots button:hover{background:rgba(237,234,228,.6)}
  .dots button[aria-current="true"]{background:var(--paper);width:34px}
  @media(max-width:760px){
    .dots{flex-direction:row;left:var(--pad);right:auto;bottom:16px}
    .slide.on img{transition:transform 6s linear}
  }
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
    rgba(10,10,11,.68) 0%,rgba(10,10,11,.12) 30%,rgba(10,10,11,.62) 62%,rgba(10,10,11,.94) 100%)}
  .hero .inner{position:relative;z-index:2;text-shadow:0 1px 24px rgba(10,10,11,.5);
    padding:var(--pad);padding-bottom:clamp(40px,7vh,86px);display:flex;flex-direction:column;
    gap:clamp(18px,2.4vh,30px);max-width:1500px;margin:0 auto;width:100%}
  .hero h1{font-size:clamp(38px,7.2vw,104px);line-height:1.02;max-width:16ch;
    opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) .45s forwards}
  .hero .sub{font-size:clamp(15px,1.5vw,20px);color:#D6D4CF;max-width:40ch;
    opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) .68s forwards}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap;opacity:0;
    animation:rise 1.1s cubic-bezier(.16,1,.3,1) .86s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--mono);
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;padding:15px 26px;border-radius:2px;
    border:1px solid var(--paper);color:var(--paper);background:none;cursor:pointer;
    transition:background .35s,color .35s,border-color .35s}
  .btn:hover{background:var(--paper);color:var(--ink)}
  .btn.solid{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  .btn.solid:hover{background:#152aa4;border-color:#152aa4;color:#fff}
  .btn.todo{border-color:var(--line);color:var(--concrete);cursor:default}
  .btn.todo:hover{background:none;color:var(--concrete)}

  .scrollcue{position:absolute;left:50%;bottom:22px;z-index:2;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:9px;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--concrete)}
  .scrollcue i{display:block;width:1px;height:46px;background:linear-gradient(var(--concrete),transparent);
    animation:cue 2.2s ease-in-out infinite}
  @keyframes cue{0%,100%{opacity:.25;transform:scaleY(.6);transform-origin:top}50%{opacity:1;transform:scaleY(1)}}

  /* ══ TOUR ══ */
  .tour{position:relative;height:440svh}
  .tour-sticky{position:sticky;top:0;height:100svh;overflow:hidden}
  .tour-frame{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
  .tour-frame.on{opacity:1}
  .tour-frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);
    transition:transform 7s cubic-bezier(.2,.6,.3,1)}
  .tour-frame.on img{transform:scale(1)}
  .tour-sticky::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(10,10,11,.9) 0%,rgba(10,10,11,.45) 44%,rgba(10,10,11,.2) 100%)}
  @media(max-width:760px){.tour-sticky::after{
    background:linear-gradient(180deg,rgba(10,10,11,.4) 0%,rgba(10,10,11,.92) 72%)}}
  .tour-copy{position:absolute;z-index:3;inset:auto auto 0 0;padding:var(--pad);
    padding-bottom:clamp(52px,10vh,110px);max-width:min(560px,86vw);display:grid}
  .tour-item{grid-area:1/1;opacity:0;transform:translateY(20px);
    transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1);pointer-events:none}
  .tour-item.on{opacity:1;transform:none}
  .tour-item .num{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--cobalt);
    display:block;margin-bottom:14px}
  .tour-item h2{font-size:clamp(30px,4.4vw,60px);line-height:1.06;margin-bottom:16px}
  .tour-item p{color:var(--steel);font-size:clamp(14.5px,1.35vw,18px);max-width:34ch}
  .bar{position:absolute;left:var(--pad);right:var(--pad);top:0;height:1px;background:var(--line);
    z-index:4;margin-top:calc(var(--nav) + 14px)}
  .bar i{display:block;height:1px;width:0;background:var(--cobalt);transition:width .15s linear}

  /* ══ SEKCJE ══ */
  .light{background:var(--paper);color:var(--ink)}
  .dark{background:var(--ink);color:var(--paper)}
  .wrap{max-width:1500px;margin:0 auto;padding:clamp(72px,13vh,150px) var(--pad)}
  .light .eyebrow{color:#6E6B65}
  .credo{display:grid;gap:var(--gap);grid-template-columns:1fr}
  @media(min-width:900px){.credo{grid-template-columns:1.15fr .85fr;align-items:start}}
  .credo blockquote{margin:0;font-size:clamp(26px,3.6vw,50px);line-height:1.16;
    letter-spacing:-.02em;max-width:19ch}
  .credo .body{display:flex;flex-direction:column;gap:18px;color:#3B3934;max-width:60ch;font-size:16.5px}

  .offer{display:grid;gap:1px;background:var(--line-dark);border:1px solid var(--line-dark);
    border-radius:8px;overflow:hidden}
  @media(min-width:760px){.offer{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1180px){.offer{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--paper);padding:clamp(26px,3vw,40px);display:flex;flex-direction:column;
    gap:12px;min-height:220px}
  .card h3{font-size:20px;line-height:1.28}
  .card p{color:#5B584F;font-size:15px}
  .card .mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--cobalt)}

  /* ══ PORTFOLIO ══ */
  .grid{display:grid;gap:clamp(16px,2.2vw,30px)}
  @media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
  .proj{position:relative;overflow:hidden;border-radius:4px;background:var(--ink-2);
    text-decoration:none;display:flex;flex-direction:column}
  .proj .shot{overflow:hidden;border-radius:4px}
  .proj img{width:100%;aspect-ratio:4/3;object-fit:cover;
    transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
  .proj:hover img,.proj:focus-visible img{transform:scale(1.05)}
  .proj .body{padding:18px 2px 6px;display:flex;flex-direction:column;gap:8px}
  .proj .top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .proj .top b{font-weight:300;font-size:19px}
  .proj .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cobalt);white-space:nowrap}
  .proj .desc{font-size:14.5px;color:var(--concrete);line-height:1.5}
  .proj .more{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--concrete);opacity:0;transform:translateX(-6px);
    transition:opacity .35s,transform .35s}
  .proj:hover .more,.proj:focus-visible .more{opacity:1;transform:none}

  /* ══ PROCES ══ */
  .step{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,54px);
    padding:clamp(24px,3.4vh,40px) 0;border-top:1px solid var(--line);align-items:start}
  .step:last-child{border-bottom:1px solid var(--line)}
  .step .n{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--cobalt);padding-top:6px}
  .step h3{font-size:clamp(21px,2.4vw,30px)}
  .step p{color:var(--concrete);max-width:52ch;margin-top:8px;font-size:16px}

  /* ══ O MNIE ══ */
  .about{display:grid;gap:var(--gap)}
  @media(min-width:900px){.about{grid-template-columns:.8fr 1.2fr;align-items:start}}
  .portrait{position:relative;aspect-ratio:4/5;border:1px solid var(--line);border-radius:4px;
    background:var(--ink-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .portrait img{width:100%;height:100%;object-fit:cover}
  .portrait .ph{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px;text-align:center}
  .portrait .ph svg{color:var(--concrete);opacity:.5}
  .portrait .ph span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--concrete);max-width:22ch;line-height:1.7}
  .about .txt{display:flex;flex-direction:column;gap:20px}
  .about .txt p{color:var(--steel);max-width:58ch;font-size:16.5px}
  .about h2{font-size:clamp(28px,3.6vw,46px);line-height:1.12;max-width:16ch;color:var(--paper)}

  /* ══ KONTAKT ══ */
  .contact{display:grid;gap:var(--gap)}
  @media(min-width:940px){.contact{grid-template-columns:.9fr 1.1fr;align-items:start}}
  .ways{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  form{display:grid;gap:14px}
  .row{display:grid;gap:14px}
  @media(min-width:620px){.row{grid-template-columns:1fr 1fr}}
  label{display:grid;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--concrete)}
  input,select,textarea{font-family:var(--display);font-weight:300;font-size:16px;color:var(--paper);
    background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;
    border-radius:0;transition:border-color .3s}
  input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--cobalt)}
  select{appearance:none;cursor:pointer}
  select option{background:var(--ink);color:var(--paper)}
  textarea{resize:vertical;min-height:110px}
  .formnote{font-size:13.5px;color:var(--concrete);max-width:46ch}
  .sent{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cobalt);min-height:16px}

  /* ══ PODSTRONA PROJEKTU ══ */
  #project{padding-top:var(--nav)}
  .phero{position:relative;height:min(78svh,760px);overflow:hidden}
  .phero img{width:100%;height:100%;object-fit:cover}
  .phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
    rgba(10,10,11,.5) 0%,rgba(10,10,11,.08) 42%,rgba(10,10,11,.9) 100%)}
  .phead{position:absolute;z-index:2;inset:auto 0 0 0;padding:var(--pad);
    padding-bottom:clamp(30px,5vh,60px);max-width:1500px;margin:0 auto;
    display:flex;flex-direction:column;gap:12px}
  .phead .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--cobalt)}
  .phead h1{font-size:clamp(32px,5.6vw,72px);line-height:1.05}
  .phead p{color:#D6D4CF;max-width:44ch;font-size:clamp(15px,1.5vw,19px)}
  .pgrid{display:grid;gap:var(--gap)}
  @media(min-width:900px){.pgrid{grid-template-columns:1.25fr .75fr;align-items:start}}
  .pgrid .lead{font-size:clamp(17px,1.8vw,21px);line-height:1.6;color:var(--steel);max-width:56ch}
  .side{display:flex;flex-direction:column;gap:26px}
  .side h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--concrete);font-weight:300}
  .swatches{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .sw{display:flex;align-items:center;gap:13px;font-size:14.5px;color:var(--steel)}
  .sw i{width:26px;height:26px;border-radius:3px;flex:none;border:1px solid var(--line)}
  .moods{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .moods span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:6px 10px;color:var(--steel)}
  .gal{display:grid;gap:clamp(12px,1.6vw,20px)}
  @media(min-width:700px){.gal{grid-template-columns:1fr 1fr}}
  .gal figure{margin:0;overflow:hidden;border-radius:4px;background:var(--ink-2)}
  .gal figure.wide{grid-column:1/-1}
  .gal img{width:100%;height:100%;object-fit:cover;display:block}
  .mood-shot{border-radius:4px;overflow:hidden;background:var(--ink-2);max-width:760px}
  .pnav{display:flex;gap:12px;flex-wrap:wrap;padding-top:8px}

  footer{border-top:1px solid var(--line)}
  .foot{max-width:1500px;margin:0 auto;padding:clamp(34px,6vh,56px) var(--pad);
    display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:center}
  .foot .socials a{color:var(--concrete)}
  .foot small{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--concrete)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
      transition-duration:.001ms!important}
    .hero h1,.hero .sub,.hero .cta{opacity:1}
    .slide img{transform:none!important}
    .slide{transition:none}
    .tour{height:auto}
    .tour-sticky{position:static;height:auto}
    .tour-frame{position:relative;opacity:1;height:70svh}
    .tour-frame img{transform:none}
    .tour-copy{position:relative;padding-top:28px}
    .tour-item{position:relative;opacity:1;transform:none}
    .bar{display:none}
    .proj .more{opacity:1;transform:none}
  }
</style>
</head>
